name: tinted
on: workflow_dispatch
permissions:
  contents: write
jobs:
  key:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: axe
        run: brew install cameroncooke/axe/axe
      - name: build
        run: |
          set -ex
          mkdir -p Probe.app
          xcrun -sdk iphonesimulator swiftc -parse-as-library -O \
            -target arm64-apple-ios26.0-simulator app/Probe.swift -o Probe.app/Probe
          cat > Probe.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>ui.feice.probe</string>
          <key>CFBundleExecutable</key><string>Probe</string>
          <key>CFBundleName</key><string>Probe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>MinimumOSVersion</key><string>26.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          <key>UIRequiresFullScreen</key><true/>
          </dict></plist>
          EOF
          codesign -s - --force Probe.app
      - name: find
        run: |
          set +e -x
          mkdir -p out
          RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-26-5' | head -1)
          TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max
          UDID=$(xcrun simctl create probe "$TYPE" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          DATA=~/Library/Developer/CoreSimulator/Devices/$UDID/data
          snap() { find "$DATA" -name "*.plist" -size -2M 2>/dev/null | sort | while read f; do echo "=== $f"; plutil -p "$f" 2>/dev/null; done > "$1"; }
          ui() { axe describe-ui --udid "$UDID" > "out/ui_$1.json" 2>&1; xcrun simctl io "$UDID" screenshot --type=png "out/ui_$1.png"; }
          tapl() {
            python3 - "$UDID" "$1" "out/ui_$2.json" <<'PY'
          import json,sys,subprocess
          udid,label,path=sys.argv[1],sys.argv[2],sys.argv[3]
          data=json.load(open(path))
          def walk(n):
              yield n
              for c in n.get('children',[]) or []:
                  yield from walk(c)
          roots=data if isinstance(data,list) else [data]
          for r in roots:
              for n in walk(r):
                  if label.lower() in str(n.get('AXLabel') or '').lower():
                      f=n.get('frame') or {}
                      x=f.get('x',0)+f.get('width',0)/2; y=f.get('y',0)+f.get('height',0)/2
                      print('tap',label,x,y)
                      subprocess.run(['axe','tap','-x',str(x),'-y',str(y),'--udid',udid])
                      sys.exit(0)
          print('not found',label)
          PY
          }
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 4
          ui 0
          tapl "Display" 0
          sleep 2
          ui 1
          tapl "Liquid Glass" 1
          sleep 2
          ui 2
          snap out/before.txt
          xcrun simctl spawn "$UDID" defaults read > out/defaults_before.txt 2>&1
          xcrun simctl install "$UDID" Probe.app
          probe() {
            for MODE in light dark; do
              xcrun simctl ui "$UDID" appearance $MODE
              for S in g25 g75; do
                xcrun simctl terminate "$UDID" ui.feice.probe 2>/dev/null || true
                xcrun simctl launch "$UDID" ui.feice.probe -scene $S -glass capsule -dump 1
                sleep 6
                D=$(xcrun simctl get_app_container "$UDID" ui.feice.probe data)
                cp "$D/Documents/dump.txt" "out/$1_${MODE}_${S}.txt"
                rm -f "$D/Documents/dump.txt"
                xcrun simctl io "$UDID" screenshot --type=png "out/$1_${MODE}_${S}.png"
              done
            done
            xcrun simctl ui "$UDID" appearance light
          }
          probe clear
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 3
          ui 2b
          # 26.x 是「透明 / 色调」二选一：点「Tinted」
          tapl "Tinted" 2b
          sleep 3
          ui 3
          snap out/after.txt
          xcrun simctl spawn "$UDID" defaults read > out/defaults_after.txt 2>&1
          diff out/before.txt out/after.txt > out/diff_plist.txt
          diff out/defaults_before.txt out/defaults_after.txt > out/diff_defaults.txt
          probe tinted
          for M in light dark; do for S in g25 g75; do diff out/clear_${M}_${S}.txt out/tinted_${M}_${S}.txt > out/diff_${M}_${S}.txt; done; done
          wc -l out/diff_*
          cat out/slider.txt out/diff_plist.txt out/diff_defaults.txt | head -80
          ls -la out
      - name: push
        run: |
          cd out
          git init -q -b tinted
          git -c user.name=probe -c user.email=probe@local add -A
          git -c user.name=probe -c user.email=probe@local commit -qm tinted
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tinted
