name: tintkey
on: workflow_dispatch
permissions:
  contents: write
jobs:
  key:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: axe
        run: brew install cameroncooke/axe/axe
      - name: find
        run: |
          set +e -x
          mkdir -p out
          RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-26-5' | head -1)
          TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max
          UDID=$(xcrun simctl create probe "$TYPE" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          DATA=~/Library/Developer/CoreSimulator/Devices/$UDID/data
          snap() { find "$DATA" -name "*.plist" -size -2M 2>/dev/null | sort | while read f; do echo "=== $f"; plutil -p "$f" 2>/dev/null; done > "$1"; }
          ui() { axe describe-ui --udid "$UDID" > "out/ui_$1.json" 2>&1; xcrun simctl io "$UDID" screenshot --type=png "out/ui_$1.png"; }
          tapl() {
            python3 - "$UDID" "$1" "out/ui_$2.json" <<'PY'
          import json,sys,subprocess
          udid,label,path=sys.argv[1],sys.argv[2],sys.argv[3]
          data=json.load(open(path))
          def walk(n):
              yield n
              for c in n.get('children',[]) or []:
                  yield from walk(c)
          roots=data if isinstance(data,list) else [data]
          for r in roots:
              for n in walk(r):
                  if label.lower() in str(n.get('AXLabel') or '').lower():
                      f=n.get('frame') or {}
                      x=f.get('x',0)+f.get('width',0)/2; y=f.get('y',0)+f.get('height',0)/2
                      print('tap',label,x,y)
                      subprocess.run(['axe','tap','-x',str(x),'-y',str(y),'--udid',udid])
                      sys.exit(0)
          print('not found',label)
          PY
          }
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 4
          ui 0
          tapl "Display" 0
          sleep 2
          ui 1
          tapl "Liquid Glass" 1
          sleep 2
          ui 2
          snap out/before.txt
          xcrun simctl spawn "$UDID" defaults read > out/defaults_before.txt 2>&1
          # 找滑条并拖到最右（色调）
          python3 - "$UDID" out/ui_2.json <<'PY' > out/slider.txt
          import json,sys,subprocess
          udid,path=sys.argv[1],sys.argv[2]
          data=json.load(open(path))
          def walk(n):
              yield n
              for c in n.get('children',[]) or []:
                  yield from walk(c)
          roots=data if isinstance(data,list) else [data]
          for r in roots:
              for n in walk(r):
                  t=str(n.get('type') or n.get('role') or '')
                  if 'Slider' in t or 'slider' in t:
                      f=n['frame']; print('slider',json.dumps(n)[:600])
                      y=f['y']+f['height']/2
                      subprocess.run(['axe','swipe','--start-x',str(f['x']+f['width']*0.5),'--start-y',str(y),'--end-x',str(f['x']+f['width']-2),'--end-y',str(y),'--duration','1.0','--udid',udid])
                      sys.exit(0)
          print('no slider')
          PY
          sleep 3
          ui 3
          snap out/after.txt
          xcrun simctl spawn "$UDID" defaults read > out/defaults_after.txt 2>&1
          diff out/before.txt out/after.txt > out/diff_plist.txt
          diff out/defaults_before.txt out/defaults_after.txt > out/diff_defaults.txt
          cat out/slider.txt out/diff_plist.txt out/diff_defaults.txt | head -80
          ls -la out
      - name: push
        run: |
          cd out
          git init -q -b tintkey
          git -c user.name=probe -c user.email=probe@local add -A
          git -c user.name=probe -c user.email=probe@local commit -qm tintkey
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tintkey
