name: press
on: workflow_dispatch
permissions:
  contents: write
jobs:
  press:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -ex
          xcodebuild -version
          mkdir -p Probe.app
          xcrun -sdk iphonesimulator swiftc -parse-as-library -O \
            -target arm64-apple-ios26.0-simulator app/Probe.swift -o Probe.app/Probe
          cat > Probe.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>ui.feice.probe</string>
          <key>CFBundleExecutable</key><string>Probe</string>
          <key>CFBundleName</key><string>Probe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>MinimumOSVersion</key><string>26.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          <key>UIRequiresFullScreen</key><true/>
          </dict></plist>
          EOF
          codesign -s - --force Probe.app
      - name: axe
        run: |
          set +e -x
          brew install cameroncooke/axe/axe
          axe --help; axe touch --help; axe swipe --help; axe tap --help
      - name: press
        run: |
          set +e -x
          RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-26-5' | head -1)
          TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max
          UDID=$(xcrun simctl create probe "$TYPE" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" Probe.app
          mkdir -p out
          # 标签中心（pt）：0 (66,904) 1 (175,904) 2 (284,904) 3 (374,904)
          run() {
            MODE=$1; S=$2; G=$3
            N="${MODE}_${S}_${G}"
            xcrun simctl ui "$UDID" appearance $MODE
            xcrun simctl terminate "$UDID" ui.feice.probe 2>/dev/null
            xcrun simctl launch "$UDID" ui.feice.probe -scene $S -glass tabbar -watch 9
            sleep 4
            xcrun simctl io "$UDID" recordVideo --codec h264 --force "out/$N.mp4" &
            VP=$!
            sleep 1
            case $G in
              tap) axe tap -x 284 -y 904 --udid "$UDID" ;;
              hold)
                axe touch -x 175 -y 904 --down --udid "$UDID"
                sleep 0.6; xcrun simctl io "$UDID" screenshot --type=png "out/${N}_a.png"
                sleep 0.6; xcrun simctl io "$UDID" screenshot --type=png "out/${N}_b.png"
                sleep 0.3
                axe touch -x 175 -y 904 --up --udid "$UDID" ;;
              drag) axe swipe --start-x 66 --start-y 904 --end-x 374 --end-y 904 --duration 1.2 --udid "$UDID" ;;
            esac
            sleep 3
            kill -INT $VP; wait $VP
            sleep 4
            D=$(xcrun simctl get_app_container "$UDID" ui.feice.probe data)
            cp "$D/Documents/anim.txt" "out/$N.txt"
            rm -f "$D/Documents/anim.txt"
          }
          run light g50 tap
          run light g50 hold
          run light g50 drag
          run light hues hold
          run light hstripes hold
          run dark g50 hold
          run dark hues hold
          cp ~/Library/Logs/DiagnosticReports/Probe* out/ 2>/dev/null; ls -la out
      - name: push
        run: |
          cd out
          git init -q -b press
          git -c user.name=probe -c user.email=probe@local add -A
          git -c user.name=probe -c user.email=probe@local commit -qm press
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" press
