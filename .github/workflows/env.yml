name: env
on: workflow_dispatch
jobs:
  env:
    strategy:
      matrix:
        os: [macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - run: sw_vers; uname -m
      - run: ls /Applications | grep -i xcode
      - run: xcrun simctl list runtimes
      - run: xcodebuild -version
