name: colors
on: workflow_dispatch
permissions:
  contents: write
jobs:
  colors:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -ex
          xcodebuild -version
          mkdir -p Probe.app
          xcrun -sdk iphonesimulator swiftc -parse-as-library -O \
            -target arm64-apple-ios26.0-simulator app/Probe.swift -o Probe.app/Probe
          cat > Probe.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>ui.feice.probe</string>
          <key>CFBundleExecutable</key><string>Probe</string>
          <key>CFBundleName</key><string>Probe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>MinimumOSVersion</key><string>26.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          <key>UIRequiresFullScreen</key><true/>
          </dict></plist>
          EOF
          codesign -s - --force Probe.app
      - name: colors
        run: |
          set +e -x
          RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-26-5' | head -1)
          UDID=$(xcrun simctl create probe com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$RT")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" Probe.app
          mkdir -p out
          xcrun simctl launch "$UDID" ui.feice.probe -glass none -colors 1
          sleep 8
          D=$(xcrun simctl get_app_container "$UDID" ui.feice.probe data)
          cp "$D/Documents/colors.txt" "$D/Documents/buttons.txt" out/
          cp ~/Library/Logs/DiagnosticReports/Probe* out/ 2>/dev/null; wc -l out/*
      - name: push
        run: |
          cd out
          git init -q -b colors
          git -c user.name=probe -c user.email=probe@local add -A
          git -c user.name=probe -c user.email=probe@local commit -qm colors
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" colors
